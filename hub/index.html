<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <meta name="description" content="{{tagline}}" />
    <meta property="og:title" content="{{title}}" />
    <meta property="og:description" content="{{tagline}}" />
    <meta name="theme-color" content="#07060f" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="masthead">
        <div class="brand">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
            <defs>
              <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#46d9ff" />
                <stop offset="0.5" stop-color="#9b66ff" />
                <stop offset="1" stop-color="#ff3fa4" />
              </linearGradient>
            </defs>
            <path d="M16 3 29 16 16 29 3 16Z" fill="none" stroke="url(#logo-g)" stroke-width="2.6" stroke-linejoin="round" />
            <circle cx="16" cy="16" r="3.4" fill="url(#logo-g)" />
          </svg>
          <h1>{{title}}</h1>
        </div>
        <p class="tagline">{{tagline}}</p>
      </header>

      <main>{{content}}

        <section class="remote" aria-labelledby="remote-title">
          <h2 id="remote-title">Other arcades</h2>
          <form class="connect" id="connect" novalidate>
            <input
              id="connect-address"
              type="text"
              inputmode="url"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="192.168.1.20:8080"
              aria-label="Address of another arcade: IP address, host name or URL"
              aria-describedby="connect-hint"
            />
            <button type="submit">Connect</button>
          </form>
          <p class="connect-error" id="connect-error" role="alert" hidden></p>
          <p class="hint" id="connect-hint">
            Play games from another arcade by its address, like a computer on your network running
            <code>npm run serve</code>.
          </p>
          <div id="sources"></div>
        </section>
      </main>

      <footer class="foot">
        <span>{{count}}</span>
        <span>© {{year}} {{title}}</span>
      </footer>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
